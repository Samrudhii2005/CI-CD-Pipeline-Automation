services:
  api:
    build: .
    container_name: cloud_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mysql

    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: cloud_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql_data: