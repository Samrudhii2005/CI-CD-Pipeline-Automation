name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: cloud_deployment_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      DB_NAME: cloud_deployment_db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Database Tables
        run: |
          python create_tables.py

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: |
          pytest

      # 👇 NEW STEP
      - name: Start FastAPI Application
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 10

      # 👇 NEW STEP
      - name: Health Check
        run: |
          curl --fail http://127.0.0.1:8000/health

      - name: Simulate Automated Rollback
        if: ${{ failure() }}
        run: |
          echo "======================================"
          echo "Deployment failed!"
          echo "Initiating automated rollback..."
          echo "Stopping failed deployment..."
          echo "Restoring previous stable version..."
          echo "Rollback completed successfully."
          echo "======================================"